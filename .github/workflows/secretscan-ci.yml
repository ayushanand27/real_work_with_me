name: secretscan CI
on:
  push:
    paths: ["secretscan/**", ".github/workflows/secretscan-ci.yml"]
  pull_request:
    paths: ["secretscan/**"]
defaults:
  run:
    working-directory: secretscan
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: pytest -q
      - name: Scan for secrets (dogfooding)
        run: python secretscan.py . --exclude-tests
